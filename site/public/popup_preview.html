<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Popup - Vetis</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body {
        margin: 0;
        font-family: 'Public Sans', sans-serif;
        background: #fdfcf9;
        min-height: 100vh;
    }
    .demo-bg {
        min-height: 100vh;
        background: linear-gradient(135deg, #1a2e1a 0%, #2a4a2a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .demo-label {
        position: fixed;
        top: 16px;
        left: 16px;
        background: #d4af37;
        color: #1a2e1a;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 13px;
        z-index: 999999;
    }
</style>

<!-- ===== POPUP STYLES ===== -->
<style>
.vetis-popup-overlay {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(26, 46, 26, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    animation: vetisOverlayIn 0.5s ease forwards;
}
@keyframes vetisOverlayIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.vetis-popup-card {
    background: #fdfcf9;
    border-radius: 28px;
    max-width: 440px;
    width: 100%;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.3), 0 0 0 1px rgba(212,175,55,0.15);
    transform: scale(0.85) translateY(30px);
    animation: vetisCardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
}
@keyframes vetisCardIn {
    from { transform: scale(0.85) translateY(30px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
}

/* Decorative top banner */
.vetis-popup-header {
    background: linear-gradient(135deg, #1a2e1a 0%, #2d4a2d 60%, #1a2e1a 100%);
    padding: 40px 36px 48px;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.vetis-popup-header::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -60px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: rgba(212, 175, 55, 0.08);
}
.vetis-popup-header::after {
    content: '';
    position: absolute;
    bottom: -40px;
    left: -40px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: rgba(212, 175, 55, 0.06);
}

/* Icon area with rings */
.vetis-popup-icon-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
}
.vetis-popup-icon-ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid rgba(212, 175, 55, 0.15);
}
.vetis-popup-icon-ring-1 {
    width: 100px; height: 100px;
    animation: vetisRingPulse 3s ease-in-out infinite;
}
.vetis-popup-icon-ring-2 {
    width: 130px; height: 130px;
    animation: vetisRingPulse 3s ease-in-out 0.5s infinite;
}
.vetis-popup-icon-ring-3 {
    width: 160px; height: 160px;
    animation: vetisRingPulse 3s ease-in-out 1s infinite;
}
@keyframes vetisRingPulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.05); }
}

.vetis-popup-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4af37, #c49b2c);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(212, 175, 55, 0.35);
    position: relative;
    z-index: 2;
}
.vetis-popup-icon span {
    color: #1a2e1a;
    font-size: 34px;
    font-variation-settings: 'FILL' 1;
}

.vetis-popup-header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    color: #d4af37;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

/* Body */
.vetis-popup-body {
    padding: 32px 36px 36px;
    text-align: center;
}

.vetis-popup-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: #1a2e1a;
    margin: 0 0 12px;
    line-height: 1.3;
}
.vetis-popup-title em {
    color: #d4af37;
    font-style: italic;
}

.vetis-popup-text {
    font-family: 'Public Sans', sans-serif;
    font-size: 15px;
    color: #64748b;
    margin: 0 0 28px;
    line-height: 1.65;
}

.vetis-popup-btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 32px;
    background: linear-gradient(135deg, #1a2e1a, #2d4a2d);
    color: #d4af37;
    border: none;
    border-radius: 16px;
    font-family: 'Public Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 6px 24px rgba(26, 46, 26, 0.25);
    margin-bottom: 10px;
}
.vetis-popup-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(26, 46, 26, 0.35);
    background: linear-gradient(135deg, #2d4a2d, #1a2e1a);
}

.vetis-popup-btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px 32px;
    background: transparent;
    color: #1a2e1a;
    border: 2px solid #1a2e1a;
    border-radius: 16px;
    font-family: 'Public Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
}
.vetis-popup-btn-secondary:hover {
    background: #1a2e1a;
    color: #fdfcf9;
}

/* Close button */
.vetis-popup-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.12);
    color: rgba(255,255,255,0.7);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    line-height: 1;
    z-index: 10;
}
.vetis-popup-close:hover {
    background: rgba(255, 255, 255, 0.25);
    color: #fff;
    transform: rotate(90deg);
}
</style>
</head>
<body>

<div class="demo-label">⚡ Vista previa del Popup</div>

<div class="demo-bg">

<!-- ===== POPUP HTML ===== -->
<div class="vetis-popup-overlay" id="vetis-audioteca-popup">
    <div class="vetis-popup-card">
        <button class="vetis-popup-close" id="vetis-popup-close" aria-label="Cerrar">&times;</button>
        
        <!-- Header with icon -->
        <div class="vetis-popup-header">
            <div class="vetis-popup-icon-wrap">
                <div class="vetis-popup-icon-ring vetis-popup-icon-ring-1"></div>
                <div class="vetis-popup-icon-ring vetis-popup-icon-ring-2"></div>
                <div class="vetis-popup-icon-ring vetis-popup-icon-ring-3"></div>
                <div class="vetis-popup-icon">
                    <span class="material-symbols-outlined">headphones</span>
                </div>
            </div>
            <div class="vetis-popup-header-badge">
                <span class="material-symbols-outlined" style="font-size:14px;">volume_up</span>
                Contenido gratuito
            </div>
        </div>

        <!-- Body -->
        <div class="vetis-popup-body">
            <h2 class="vetis-popup-title">¿Sabías que Vetis tiene una <em>Audioteca gratuita</em>?</h2>
            <p class="vetis-popup-text">Explora audios gratuitos y descubre una parte de lo que es Vetis.</p>
            <a href="https://vetisdigital.com/audioteca/" class="vetis-popup-btn-primary">
                <span class="material-symbols-outlined" style="font-size:20px;font-variation-settings:'FILL' 1;">headphones</span>
                ¡Quiero descubrirla!
            </a>
            <button class="vetis-popup-btn-secondary" id="vetis-popup-dismiss">
                Seguir navegando
            </button>
        </div>
    </div>
</div>

</div>

<script>
    document.getElementById('vetis-popup-close').addEventListener('click', function() {
        document.getElementById('vetis-audioteca-popup').style.display = 'none';
    });
    document.getElementById('vetis-popup-dismiss').addEventListener('click', function() {
        document.getElementById('vetis-audioteca-popup').style.display = 'none';
    });
    document.getElementById('vetis-audioteca-popup').addEventListener('click', function(e) {
        if (e.target === this) this.style.display = 'none';
    });
</script>

</body>
</html>
